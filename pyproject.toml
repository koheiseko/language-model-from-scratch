[project]
name = "language-model-from-scratch"
version = "0.1.0"
description = "Este projeto tem o objetivo de implementar um modelo de linguagem causal do zero."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8",
    "jaxtyping>=0.3",
    "numpy>=2.4",
    "regex>=2026.3.32",
    "tiktoken>=0.12.0",
    "torch~=2.11.0",
    "tqdm>=4.67",
    "wandb>=0.25",
    "ty>=0.0.26",
    "ruff>=0.15.8",
    "datasets==3.6.0",
    "scikit-learn>=1.9.0",
    "reportlab>=4.5.1",
    "lxml>=6.1.1",
    "transformers>=4.31.0",
    "tokenizers>=0.22.2",
    "marimo>=0.23.14",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["languagemodel"]

[tool.uv.build-backend]
module-name = "languagemodel"
module-root = ""

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv]
package = true
python-preference = "managed"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

[tool.ruff]
line-length = 80


[tool.ruff.lint]
select = [
    "E",  
    "W",  
    "F",  
    "I",  
    "B",  
    "C4",
    "UP",  
]
extend-ignore = ["F722"]

ignore = [
    "E501",  
    "B008",  
    "C901",  
    "W191", 
    "F722", 
    "F821" 
]

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[dependency-groups]
dev = [
    "e>=1.4.5",
]
