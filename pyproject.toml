[project]
name = "language-model-from-scratch"
version = "0.1.0"
description = "Este projeto tem o objetivo de implementar um modelo de linguagem causal do zero."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=3.6.0",
    "einops>=0.8.0",
    "jaxtyping>=0.3.0",
    "numpy>=2.4.0",
    "tokenizers>=0.22.2",
    "torch~=2.11.0",
    "tqdm>=4.67.0",
    "wandb>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "languagemodel"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["B008", "C901", "F722", "F821"]

[tool.ruff.lint.extend-per-file-ignores]
"languagemodel/__init__.py" = ["E402", "F401", "F403"]
